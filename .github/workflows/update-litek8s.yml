name: update-litek8s

# Keeps Formula/litek8s.rb on the latest litek8s release. Polling (and a
# manual run) instead of a cross-repo trigger, so no personal access token is
# needed: this repo's own GITHUB_TOKEN commits the change.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: the latest)"
        required: false

permissions:
  contents: write

concurrency:
  group: update-litek8s
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/update-litek8s ${{ inputs.tag }}

      - name: Commit if it changed
        run: |
          if git diff --quiet; then
            echo "Formula/litek8s.rb is up to date"
            exit 0
          fi
          version="$(sed -n 's/^  version "\(.*\)"/\1/p' Formula/litek8s.rb)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "litek8s $version"
          git push

  # The formula installs on every platform it names.
  test:
    needs: update
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Install from this tap
        run: |
          tap="${GITHUB_REPOSITORY%%/*}/tap"
          brew tap "$tap" "https://github.com/$GITHUB_REPOSITORY"
          # setup-homebrew taps this repository at the commit that started
          # the run, before the update job's commit: test what is on main now.
          dir="$(brew --repository "$tap")"
          git -C "$dir" fetch --quiet origin main
          git -C "$dir" checkout --quiet --detach FETCH_HEAD
          want="$(sed -n 's/^  version "\(.*\)"/\1/p' "$dir/Formula/litek8s.rb")"
          brew install "$tap/litek8s"
          brew test "$tap/litek8s"
          litek8s --version | grep -F "litek8s $want"
          if litek8s --help | grep -q completion; then
            ls "$(brew --prefix)/share/zsh/site-functions/_litek8s" "$(brew --prefix)/etc/bash_completion.d/litek8s"
          fi
